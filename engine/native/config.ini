# Face unlock engine settings. System Settings > Face Unlock edits these.
# Keys follow Howdy's config.ini.

[core]
# Show "Attempting facial authentication"; the login and lock screen animation needs it
detection_notice = true
# Don't show "Identified face as <user>"
no_confirmation = false
abort_if_ssh = true
abort_if_lid_closed = true
# Turn face unlock off without touching PAM
disabled = false

[video]
# Highest match score that is accepted, (1 - cosine similarity) x 10; lower is stricter
certainty = 6.0
# Seconds to look for a face before giving up
timeout = 4
# IR camera; found automatically on first setup
device_path = none
# Also look for faces turned sideways: 0 no, 1 upright and portrait, 2 portrait only
rotate = 0
# Frames are scaled down to this height before detection
max_height = 320
# Skip frames where more than this share (%) of pixels is near black
dark_threshold = 60

[snapshots]
save_failed = false
