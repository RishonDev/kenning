name: Feature request
description: Suggest something Kenning could do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you'd like to do
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
      description: Optional. Screenshots or examples from other software are welcome.
